<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1026">
<title>2048 Космооперация</title>
<link rel="stylesheet" href="css/style.css">
<script>
  // Стаб объявлен до подключения SDK: тег async может отработать
  // раньше, чем загрузится код игры.
  window.__sdkSettled = false;
  window.initSDK = function () {
    window.__sdkSettled = true;
    if (window.__startApp) window.__startApp();
  };
</script>
<!-- Yandex Games SDK -->
<script async src="/sdk.js" onload="initSDK()" onerror="initSDK()"></script>
</head>
<body>

<!-- Спрайт: всё рисуется кодом, внешних файлов нет -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

    <symbol id="b-dust" viewBox="0 0 100 100">
      <g fill="currentColor">
        <circle cx="42" cy="46" r="9"/><circle cx="62" cy="58" r="6"/>
        <circle cx="58" cy="36" r="4.5"/><circle cx="36" cy="64" r="3.5"/>
      </g>
    </symbol>

    <symbol id="b-meteor" viewBox="0 0 100 100">
      <path d="M58 22 L78 38 L72 62 L48 70 L30 54 L36 30 Z" fill="currentColor"/>
      <g fill="currentColor" opacity="0.45">
        <path d="M30 54 L10 74"/><circle cx="20" cy="66" r="4"/><circle cx="12" cy="76" r="3"/>
      </g>
    </symbol>

    <symbol id="b-asteroid" viewBox="0 0 100 100">
      <path d="M50 12 L74 22 L86 46 L76 72 L52 86 L26 76 L14 50 L24 24 Z" fill="currentColor"/>
      <g fill="#000" opacity="0.22">
        <circle cx="40" cy="40" r="9"/><circle cx="62" cy="56" r="7"/><circle cx="52" cy="26" r="5"/>
      </g>
    </symbol>

    <symbol id="b-comet" viewBox="0 0 100 100">
      <circle cx="64" cy="36" r="19" fill="currentColor"/>
      <path d="M50 48 L12 86 M56 54 L26 88 M44 40 L8 66" stroke="currentColor"
            stroke-width="7" stroke-linecap="round" opacity="0.55" fill="none"/>
    </symbol>

    <symbol id="b-moon" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="36" fill="currentColor"/>
      <g fill="#000" opacity="0.2">
        <circle cx="38" cy="38" r="10"/><circle cx="62" cy="56" r="8"/>
        <circle cx="56" cy="30" r="5"/><circle cx="36" cy="64" r="6"/>
      </g>
    </symbol>

    <symbol id="b-planet" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="36" fill="currentColor"/>
      <g fill="#000" opacity="0.24">
        <path d="M24 44 q14 -10 28 -2 t22 -4 v10 q-12 8 -24 2 t-26 4 Z"/>
        <path d="M32 66 q12 -8 24 -1 t16 -3 v8 q-10 6 -20 1 t-20 3 Z"/>
      </g>
    </symbol>

    <symbol id="b-gasgiant" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="34" fill="currentColor"/>
      <g fill="#000" opacity="0.22">
        <rect x="18" y="38" width="64" height="7" rx="3.5"/>
        <rect x="16" y="52" width="68" height="9" rx="4.5"/>
        <rect x="22" y="68" width="56" height="6" rx="3"/>
      </g>
      <ellipse cx="50" cy="50" rx="47" ry="13" fill="none" stroke="currentColor"
               stroke-width="6" opacity="0.75" transform="rotate(-20 50 50)"/>
    </symbol>

    <symbol id="b-star" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="24" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.8">
        <path d="M50 6 V22"/><path d="M50 78 V94"/><path d="M6 50 H22"/><path d="M78 50 H94"/>
        <path d="M19 19 L30 30"/><path d="M70 70 L81 81"/>
        <path d="M81 19 L70 30"/><path d="M30 70 L19 81"/>
      </g>
    </symbol>

    <symbol id="b-redgiant" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="currentColor" opacity="0.35"/>
      <circle cx="50" cy="50" r="28" fill="currentColor"/>
      <g fill="#000" opacity="0.18">
        <circle cx="40" cy="42" r="7"/><circle cx="60" cy="58" r="6"/>
      </g>
    </symbol>

    <symbol id="b-supernova" viewBox="0 0 100 100">
      <g stroke="currentColor" stroke-width="8" stroke-linecap="round">
        <path d="M50 4 V28"/><path d="M50 72 V96"/><path d="M4 50 H28"/><path d="M72 50 H96"/>
        <path d="M14 14 L32 32"/><path d="M68 68 L86 86"/>
        <path d="M86 14 L68 32"/><path d="M32 68 L14 86"/>
      </g>
      <circle cx="50" cy="50" r="17" fill="currentColor"/>
    </symbol>

    <symbol id="b-blackhole" viewBox="0 0 100 100">
      <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="currentColor"
               stroke-width="9" transform="rotate(-18 50 50)"/>
      <circle cx="50" cy="50" r="21" fill="#000"/>
      <circle cx="50" cy="50" r="21" fill="none" stroke="currentColor" stroke-width="4" opacity="0.8"/>
    </symbol>

    <symbol id="b-quasar" viewBox="0 0 100 100">
      <path d="M50 50 L34 4 H66 Z" fill="currentColor" opacity="0.7"/>
      <path d="M50 50 L34 96 H66 Z" fill="currentColor" opacity="0.7"/>
      <ellipse cx="50" cy="50" rx="40" ry="12" fill="none" stroke="currentColor" stroke-width="7"/>
      <circle cx="50" cy="50" r="12" fill="currentColor"/>
    </symbol>

    <symbol id="b-galaxy" viewBox="0 0 100 100">
      <g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
        <path d="M50 50 C 50 24 74 16 88 28"/>
        <path d="M50 50 C 50 76 26 84 12 72"/>
        <path d="M50 50 C 30 42 22 22 34 12" opacity="0.6"/>
        <path d="M50 50 C 70 58 78 78 66 88" opacity="0.6"/>
      </g>
      <circle cx="50" cy="50" r="11" fill="currentColor"/>
    </symbol>

    <symbol id="i-undo" viewBox="0 0 24 24">
      <path d="M4 9h9a6 6 0 1 1 0 12H8" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 4 3.5 9 8 14" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-restart" viewBox="0 0 24 24">
      <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round"/>
      <path d="M20.6 3.4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <symbol id="i-sound-on" viewBox="0 0 24 24">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/>
      <path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-sound-off" viewBox="0 0 24 24">
      <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" fill="currentColor"/>
      <path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

  </defs>
</svg>

<div id="boot" class="boot">
  <div class="boot__orbit"><span></span><span></span><span></span></div>
  <p class="boot__text">Загрузка</p>
</div>

<main id="app" class="app" hidden>

  <header class="topbar">
    <h1 class="wordmark"><span class="wordmark__b">2048</span><span class="wordmark__a">Космооперация</span></h1>
    <div class="scores">
      <div class="score" id="scoreBox">
        <span class="score__label" data-i18n="score">Счёт</span>
        <span class="score__value" id="score">0</span>
      </div>
      <div class="score score--best">
        <span class="score__label" data-i18n="best">Рекорд</span>
        <span class="score__value" id="best">0</span>
      </div>
    </div>
  </header>

  <section class="stage">
    <div class="board" id="board" role="application" aria-label="Игровое поле" tabindex="0">
      <div class="board__cells" id="cells" aria-hidden="true"></div>
      <div class="board__tiles" id="tiles"></div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay__card">
          <p class="overlay__eyebrow" id="overlayEyebrow"></p>
          <h2 class="overlay__title" id="overlayTitle"></h2>
          <p class="overlay__sub" id="overlaySub"></p>
          <div class="overlay__actions" id="overlayActions"></div>
        </div>
      </div>
    </div>
  </section>

  <p class="hint" id="hint" data-i18n="hint">Соединяй планеты — создавай вселенные</p>

  <nav class="controls">
    <button class="btn" id="undoBtn" type="button">
      <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-undo"></use></svg>
      <span class="btn__text" data-i18n="undo">Отмена</span>
      <span class="btn__badge" id="undoCount">3</span>
    </button>
    <button class="btn" id="restartBtn" type="button">
      <svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-restart"></use></svg>
      <span class="btn__text" data-i18n="restart">Заново</span>
    </button>
    <button class="btn btn--icon" id="soundBtn" type="button" aria-label="Звук"><svg class="btn__icon" id="soundIcon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sound-on"></use></svg></button>
    <button class="btn btn--icon" id="menuBtn" type="button" aria-label="Меню"><svg class="btn__icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"></use></svg></button>
  </nav>

  <section class="ladder" aria-labelledby="ladderTitle">
    <h2 class="ladder__title" id="ladderTitle" data-i18n="ladderTitle">Открытые миры</h2>
    <div class="ladder__rail" id="ladder"></div>
  </section>

</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 class="sheet__title" id="sheetTitle" data-i18n="settings">Настройки</h2>

    <div class="field">
      <span class="field__label" data-i18n="boardSize">Размер поля</span>
      <div class="segmented" id="sizePicker">
        <button type="button" data-size="4" class="segmented__btn is-active">4 × 4</button>
        <button type="button" data-size="5" class="segmented__btn">5 × 5</button>
        <button type="button" data-size="6" class="segmented__btn">6 × 6</button>
      </div>
    </div>

    <div class="field">
      <span class="field__label" data-i18n="language">Язык</span>
      <div class="segmented" id="langPicker">
        <button type="button" data-lang="ru" class="segmented__btn">Русский</button>
        <button type="button" data-lang="en" class="segmented__btn">English</button>
        <button type="button" data-lang="tr" class="segmented__btn">Türkçe</button>
      </div>
    </div>

    <p class="sheet__note" data-i18n="sizeNote">Смена размера поля начинает новую партию.</p>

    <button class="btn btn--wide" id="sheetClose" type="button" data-i18n="close">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast" hidden>
  <span class="toast__chip" id="toastChip"><svg class="toast__icon" id="toastIcon" viewBox="0 0 100 100" aria-hidden="true"><use href="#b-dust"></use></svg></span>
  <span class="toast__body">
    <span class="toast__eyebrow" data-i18n="discovery">Новый объект</span>
    <span class="toast__name" id="toastName"></span>
  </span>
</div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/ysdk.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
