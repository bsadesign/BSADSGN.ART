<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
  
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #0E0A09; overflow: hidden;
         font-family: Carlito, 'Liberation Sans', sans-serif; color: #F0E8DA; position: relative; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(620px 520px at 84% 14%, rgba(199,154,62,.20), transparent 62%),
      radial-gradient(520px 460px at 12% 92%, rgba(35,169,142,.13), transparent 60%); }
  .frame { position: absolute; inset: 34px; border: 1px solid rgba(199,154,62,.30); border-radius: 4px; }
  .in { position: absolute; inset: 78px 84px; display: flex; flex-direction: column; justify-content: space-between; width: 640px; }
  .logo { position: absolute; right: 92px; top: 50%; transform: translateY(-50%); width: 330px; }
  .logo img { width: 100%; display: block; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark .b { width: 38px; height: 38px; border: 1.2px solid #C79A3E; border-radius: 3px;
             display: grid; place-items: center; font-family: Lora, 'Liberation Serif', serif; font-size: 20px; color: #F6DFA0; }
  .bsa { font-family: Lora, 'Liberation Serif', serif; font-size: 23px; letter-spacing: .16em; }
  .rule { width: 1px; height: 20px; background: #C79A3E; opacity: .7; }
  .sub { font-family: 'DejaVu Sans Mono', monospace; font-size: 13px; letter-spacing: .2em;
         text-transform: uppercase; color: #C79A3E; }
  h1 { font-family: Lora, 'Liberation Serif', serif; font-size: 56px; line-height: 1.08;
       letter-spacing: -.5px; max-width: 15ch; font-weight: 400; }
  h1 em { font-style: normal; color: #F6DFA0; }
  .lead { margin-top: 20px; font-size: 20px; line-height: 1.5; color: #C9BEAE; max-width: 34ch; font-weight: 300; }
  .foot { display: flex; align-items: center; gap: 26px;
          font-family: 'DejaVu Sans Mono', monospace; font-size: 15px; letter-spacing: .1em;
          text-transform: uppercase; color: #9A9084; }
  .foot b { color: #F6DFA0; font-weight: 500; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #23A98E; }
  .hair { position: absolute; left: 84px; right: 420px; bottom: 152px; height: 1px;
          background: linear-gradient(90deg, rgba(199,154,62,.45), rgba(199,154,62,.06) 70%, transparent); }
</style></head>
<body>
  <div class="glow"></div><div class="frame"></div><div class="hair"></div>
  <div class="logo"><img src="logo-bsa.png" alt=""></div>
  <div class="in">
    <div class="sub">Sergey · веб-дизайн и вёрстка</div>
    <div>
      <h1>Сайты под ключ<br><em>для малого бизнеса</em></h1>
      <p class="lead">От структуры и дизайна до готовой версии в браузере. Лендинг — от 3000&nbsp;₽, срок — от одного дня.</p>
    </div>
    <div class="foot">
      <span><b>bsadsgn.art</b></span><span class="dot"></span><span>@bsa_dsgn</span><span>·</span><span>удалённо</span>
    </div>
  </div>
</body></html>
